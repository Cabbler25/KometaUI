[project]
name = "kometaui-backend"
version = "0.1.0"
description = "Backend service for KometaUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    # Pinned to the version Kometa itself uses, so round-trip formatting (comment
    # placement, quoting style, key order) matches byte-for-byte.
    "ruamel.yaml==0.19.1",
    "jsonschema==4.26.0",
    "PlexAPI==4.18.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
]
# Enables the Kometa-native validator (Tier C). Kometa's modules/validator.py reaches
# modules/util.py, which imports these; they are small and pure-Python, so we depend on
# them directly rather than making users install Kometa's full requirements.txt.
kometa = [
    "num2words>=0.5.14",
    "pathvalidate>=3.3.1",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
